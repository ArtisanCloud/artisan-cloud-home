server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Missing static files must not return the SPA document.
    location ^~ /assets/ {
        try_files $uri =404;
    }
    location ^~ /images/ {
        try_files $uri =404;
    }
    location = /ads.txt {
        try_files $uri =404;
    }
    location = /vite.svg {
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Every supported route has prerendered HTML. Unknown URLs are real 404s.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
    location / {
        try_files $uri $uri/index.html =404;
    }
}
