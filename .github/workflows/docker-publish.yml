name: Build and Publish Docker Image

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: artisancloud/artisan-cloud-home

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=long
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published AMD64 website
        env:
          IMAGE: ghcr.io/artisancloud/artisan-cloud-home:sha-${{ github.sha }}
        run: |
          set -eu
          docker pull --platform linux/amd64 "$IMAGE"
          docker run -d --name artisan-home-smoke -p 127.0.0.1:8080:80 "$IMAGE"
          trap 'docker logs artisan-home-smoke; docker rm -f artisan-home-smoke' EXIT
          curl --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 -fsS \
            --output /tmp/artisan-home.html http://127.0.0.1:8080/
          grep -q ArtisanCloud /tmp/artisan-home.html
          for route in products products/powerwechat cases contact contact-by-email; do
            curl -fsS "http://127.0.0.1:8080/$route" | cmp - /tmp/artisan-home.html
          done
          curl -fsS http://127.0.0.1:8080/ads.txt > /dev/null
          curl -fsS http://127.0.0.1:8080/images/products/px-home.png > /dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/assets/xdocker-missing.js)" = 404
